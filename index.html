<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Weather app</title>

  <!-- RESET STYLESHEET -->
  <link rel="stylesheet" href="./css/reset.css">

  <!-- MAIN STYLESHEET -->
  <link rel="stylesheet" href="./css/style.css">

  <script src="./script.js" defer></script>
</head>

<body>

  <header>
    <div class="logo-dropdown">
      <img src="./assets/images/logo.svg" alt="Weather App Logo">

      <select class="dropdown header_dropdown" name="Units" id="ddlUnits">
        <option value="">Units</option>
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
      </select>

      <!-- Units
      
      Switch to Imperial/Metric
      
      Temperature
      
      Celsius (°C)
      Fahrenheit (°F)
      
      Wind Speed
      
      km/h
      mph
      
      Precipitation
      
      Millimeters (mm)
      Inches (in) -->
    </div>
  </header>

  <main id="main">

    <section class="hero">
      <h1 class="hero_title">How's the sky looking today?</h1>

      <div class="hero_search">
        <input class="hero_textbox" type="text" name="search" id="txtSearch" placeholder="Search for a place..." aria-label="Search for a place">
        <button type="submit" id="btn-search">Search</button>
      </div>
    </section>

    <div class="dashboard">

      <section class="current">
        <h2 class="visually-hidden">Current Weather</h2>

        <div class="current_weather">

          <div class="current_location">
            <div id="dvCityCountry" class="current_city"></div>
            <div id="dvCurrDate" class="current_date"></div>
          </div>

          <div class="current_info">

            <img src="./assets/images/icon-sunny.webp" class="current_icon" alt="">
            <div class="current_temp"><span id="dvCurrTemp"></span>&deg;</div>

          </div>

        </div>

        <div class="current_conditions">
          <div class="current_condition">
            <p class="current_condition-title">Feels Like</p>
            <p class="current_condition-value"><span id="pFeelsLike"></span>&deg;</p>
          </div>

          <div class="current_condition">
            <p class="current_condition-title">Humidity</p>
            <p class="current_condition-value"><span id="pHumidity"></span>%</p>
          </div>

          <div class="current_condition">
            <p class="current_condition-title">Wind</p>
            <p class="current_condition-value"><span id="pWind"></span></p>
          </div>

          <div class="current_condition">
            <p class="current_condition-title">Precipitation</p>
            <p class="current_condition-value"><span id="pPrecipitation"></span></p>
          </div>
        </div>

      </section>

      <section class="daily">
        <h2 class="section_title daily_title">Daily forecast</h2>

        <div class="daily_forecast">

          <div id="dvForecastDay1" class="block daily_day"></div>
          <div id="dvForecastDay2" class="block daily_day"></div>
          <div id="dvForecastDay3" class="block daily_day"></div>
          <div id="dvForecastDay4" class="block daily_day"></div>
          <div id="dvForecastDay5" class="block daily_day"></div>
          <div id="dvForecastDay6" class="block daily_day"></div>
          <div id="dvForecastDay7" class="block daily_day"></div>

        </div>



      </section>

      <section class="hourly">

        <div class="hourly_container">

          <div class="hourly_header">
            <h2 class="section_title hourly_title">Hourly forecast</h2>
            <select class="dropdown hourly_select" id="ddlDay" name="hourly-day"></select>
          </div>

          <div class="hourly_hours">
            <div id="dvForecastHour1" class="hourly_hour"></div>
            <div id="dvForecastHour2" class="hourly_hour"></div>
            <div id="dvForecastHour3" class="hourly_hour"></div>
            <div id="dvForecastHour4" class="hourly_hour"></div>
            <div id="dvForecastHour5" class="hourly_hour"></div>
            <div id="dvForecastHour6" class="hourly_hour"></div>
            <div id="dvForecastHour7" class="hourly_hour"></div>
            <div id="dvForecastHour8" class="hourly_hour"></div>
            <div id="dvForecastHour9" class="hourly_hour"></div>
            <div id="dvForecastHour10" class="hourly_hour"></div>
            <div id="dvForecastHour11" class="hourly_hour"></div>
            <div id="dvForecastHour12" class="hourly_hour"></div>
            <div id="dvForecastHour13" class="hourly_hour"></div>
            <div id="dvForecastHour14" class="hourly_hour"></div>
            <div id="dvForecastHour15" class="hourly_hour"></div>
            <div id="dvForecastHour16" class="hourly_hour"></div>
            <div id="dvForecastHour17" class="hourly_hour"></div>
            <div id="dvForecastHour18" class="hourly_hour"></div>
            <div id="dvForecastHour19" class="hourly_hour"></div>
            <div id="dvForecastHour20" class="hourly_hour"></div>
            <div id="dvForecastHour21" class="hourly_hour"></div>
            <div id="dvForecastHour22" class="hourly_hour"></div>
            <div id="dvForecastHour23" class="hourly_hour"></div>
            <div id="dvForecastHour24" class="hourly_hour"></div>
          </div>

        </div>

        
      </section>
    </div>

  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.<br>
    Coded by <a href="https://github.com/rame0033/">Gian Ramelb</a>.
  </footer>
</body>

</html>
